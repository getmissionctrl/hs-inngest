name: Setup
description: Install Nix and restore the cabal build cache (shared by all jobs).

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        # nix-community cache serves the (unfree, SSPL) Inngest dev-server binary.
        extra-conf: |
          extra-substituters = https://nix-community.cachix.org
          extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

    # dist-newstyle references the pinned (flake.lock) GHC + deps store paths,
    # which are identical across jobs, so the build job's output is reusable by
    # the test/e2e jobs. Keyed on the toolchain + all sources.
    - name: Cache build
      uses: actions/cache@v4
      with:
        path: dist-newstyle
        key: dist-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', '**/*.cabal', 'cabal.project', 'src/**/*.hs', 'test/**/*.hs', 'example/**/*.hs') }}
